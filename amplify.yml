version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install --legacy-peer-deps
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: X-Content-Type-Options
              value: nosniff
            - key: X-Frame-Options
              value: DENY
            - key: Referrer-Policy
              value: strict-origin-when-cross-origin
            - key: Permissions-Policy
              value: camera=(), microphone=(), geolocation=()
            - key: Content-Security-Policy
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.clarity.ms https://c.bing.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com https://*.elasticbeanstalk.com https://us.i.posthog.com https://o4511416842715136.ingest.us.sentry.io https://www.clarity.ms https://c.bing.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
        - pattern: index.html
          headers:
            - key: Cache-Control
              value: no-cache, no-store, must-revalidate
            - key: Pragma
              value: no-cache
        - pattern: assets/*.js
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
        - pattern: assets/*.css
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
    appRoot: frontend
